<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Control Parquímetro</title>
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overscroll-behavior-y: none; 
            user-select: none;
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin: 0 0 25px 0; font-size: 24px; color: #333; }

        .input-group { margin-bottom: 25px; text-align: left; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"]:focus { border-color: var(--primary-color); }

        .btn {
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.98); box-shadow: none; }
        
        .btn-green { background-color: var(--success-color); }
        .btn-red { background-color: var(--danger-color); display: none; }
        .btn-blue { background-color: var(--primary-color); display: none; }

        .status-msg {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            min-height: 20px;
        }
        
        .timer-display {
            font-size: 48px;
            font-weight: 700;
            margin: 25px 0;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
        }

        .alert-box {
            display: none;
            background-color: #ffebee;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            border-left: 5px solid #d32f2f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Parquímetro</h2>
    
    <div class="input-group">
        <label for="parkingTime">Tiempo (minutos):</label>
        <input type="number" id="parkingTime" inputmode="numeric" placeholder="Ej: 60" pattern="\d*">
    </div>

    <div id="alertBox" class="alert-box">
        ⚠️ ¡QUEDAN 5 MINUTOS!
    </div>

    <button id="btnStopAlarm" class="btn btn-red">DETENER ALARMA</button>
    <button id="btnSave" class="btn btn-green">GUARDAR UBICACIÓN</button>
    <button id="btnMaps" class="btn btn-blue">📍 VER RUTA / MAPA</button>

    <div id="statusMsg" class="status-msg"></div>
    <div id="timerDisplay" class="timer-display">00:00</div>
</div>

<script>
    // --- LÓGICA DE NOTIFICACIÓN SEGUNDO PLANO ---
    
    // 1. Pedir permiso de notificación al cargar
    if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                console.log('Permiso de notificación concedido');
            }
        });
    }

    // 2. Registrar Service Worker y preparar comunicación
    let swRegistration = null;
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => {
                    swRegistration = reg;
                    console.log('SW listo para alarmas');
                })
                .catch(err => console.log('SW fallo:', err));
        });
    }

    // --- LÓGICA DE LA APP ---

    let parkingInterval;
    let endTime = null;
    let carLat = null;
    let carLng = null;
    let alarmTriggered = false;
    
    const timeInput = document.getElementById('parkingTime');
    const btnSave = document.getElementById('btnSave');
    const btnStopAlarm = document.getElementById('btnStopAlarm');
    const btnMaps = document.getElementById('btnMaps');
    const statusMsg = document.getElementById('statusMsg');
    const timerDisplay = document.getElementById('timerDisplay');
    const alertBox = document.getElementById('alertBox');

    // SONIDO MÁS FUERTE (Sirena de alarma)
    const alarmSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-police-siren-1641.mp3');
    alarmSound.loop = true;

    function resetUI() {
        clearInterval(parkingInterval);
        alarmSound.pause();
        alarmSound.currentTime = 0;
        alarmTriggered = false;
        endTime = null;
        
        // Enviar mensaje al SW para cancelar cualquier alarma pendiente
        if (swRegistration) {
            swRegistration.active.postMessage({ type: 'CANCEL_ALARM' });
        }

        statusMsg.textContent = "";
        timerDisplay.textContent = "00:00";
        alertBox.style.display = 'none';
        btnStopAlarm.style.display = 'none';
        btnMaps.style.display = 'none';
        btnSave.textContent = "GUARDAR UBICACIÓN";
        btnSave.disabled = false;
        btnSave.style.opacity = "1";
    }

    timeInput.addEventListener('input', () => {
        if(timeInput.value > 0) resetUI();
    });

    btnSave.addEventListener('click', () => {
        const minutes = parseInt(timeInput.value);
        if (!minutes || minutes <= 0) {
            statusMsg.textContent = "Ingresa minutos válidos.";
            statusMsg.style.color = "red";
            return;
        }

        statusMsg.textContent = "Obteniendo GPS...";
        statusMsg.style.color = "#555";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    carLat = position.coords.latitude;
                    carLng = position.coords.longitude;
                    
                    startTimer(minutes);
                    
                    // Configurar alarma en segundo plano a través del SW
                    const notificationTime = endTime - (5 * 60 * 1000); // 5 mins antes
                    if (swRegistration) {
                        swRegistration.active.postMessage({ 
                            type: 'SET_ALARM', 
                            timestamp: notificationTime 
                        });
                    }

                    // Desbloquear audio
                    alarmSound.play().then(() => {
                        alarmSound.pause();
                        alarmSound.currentTime = 0;
                    }).catch(e => console.log("Audio unlock"));

                    statusMsg.textContent = "¡Configurado! (Aviso activo incluso en 2do plano)";
                    statusMsg.style.color = "green";
                    btnMaps.style.display = 'block';
                    btnSave.textContent = "ACTIVO";
                    btnSave.disabled = true;
                    btnSave.style.opacity = "0.5";
                },
                (error) => {
                    let msg = "Error GPS";
                    if(error.code == 1) msg = "Permiso de ubicación denegado";
                    statusMsg.textContent = msg;
                    statusMsg.style.color = "red";
                }
            );
        }
    });

    function startTimer(minutes) {
        const now = new Date().getTime();
        endTime = now + (minutes * 60 * 1000);
        if (parkingInterval) clearInterval(parkingInterval);
        updateTimerDisplay(endTime);
        parkingInterval = setInterval(() => updateTimerDisplay(endTime), 1000);
    }

    function updateTimerDisplay(targetEndTime) {
        const currentTime = new Date().getTime();
        let distance = targetEndTime - currentTime;

        if (distance < 0) {
            clearInterval(parkingInterval);
            timerDisplay.textContent = "00:00";
            statusMsg.textContent = "TIEMPO FINALIZADO";
            statusMsg.style.color = "red";
            alarmSound.pause();
            alertBox.style.display = 'none';
            return;
        }

        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((distance % (1000 * 60)) / 1000);
        timerDisplay.textContent = 
            (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);

        if (distance <= 300000 && distance > 0 && !alarmTriggered) {
            triggerAlarm();
        }
    }

    function triggerAlarm() {
        alarmTriggered = true;
        statusMsg.textContent = "¡¡ALERTA!! Quedan < 5 min.";
        statusMsg.style.color = "#d32f2f";
        alertBox.style.display = 'block';
        btnStopAlarm.style.display = 'block';
        
        alarmSound.play().catch(e => console.error("Audio bloqueado"));
        if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500, 200, 500]); // Vibración más larga
        }
    }

    btnStopAlarm.addEventListener('click', () => {
        alarmSound.pause();
        btnStopAlarm.style.display = 'none';
        alertBox.style.display = 'none';
        statusMsg.textContent = "Alarma apagada.";
        statusMsg.style.color = "#333";
    });

    btnMaps.addEventListener('click', () => {
        if (carLat && carLng) {
            const url = `https://www.google.com/maps/dir/?api=1&destination=${carLat},${carLng}`;
            window.open(url, '_blank');
        }
    });

    // Detectar si la alarma ya sonó en segundo plano y acabamos de entrar
    if (swRegistration) {
        swRegistration.addEventListener('message', event => {
            if (event.data && event.data.type === 'ALARM_TRIGGERED') {
                // Si llegamos aquí, el SW nos avisó que ya pasó el tiempo de alarma
                triggerAlarm(); 
            }
        });
    }
</script>

</body>
</html>
