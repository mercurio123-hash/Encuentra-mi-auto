<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon-parking.png">
    <link rel="apple-touch-icon" href="icon-parking.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Pro - Julius</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 500px; margin: auto; border: 1px solid #333; }
        #map { height: 300px; width: 100%; border-radius: 10px; margin: 15px 0; border: 1px solid #444; }
        .timer-box { font-size: 1.3rem; font-weight: bold; color: #ff5252; margin: 10px 0; }
        input { padding: 12px; width: 80px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; text-align: center; font-size: 1rem; }
        button { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; width: 100%; margin: 8px 0; font-size: 1rem; }
        .btn-save { background-color: #00c853; color: white; }
        .btn-nav { background-color: #2979ff; color: white; }
        .btn-stop { background-color: #ff1744; color: white; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="card">
    <h2>🚗 Parking Julius Pro</h2>
    
    <button class="btn-save" onclick="iniciarEstacionamiento()">📍 Guardar Ubicación y Tiempo</button>
    
    <div style="margin: 15px 0;">
        <label>Tiempo parquímetro (minutos):</label><br>
        <input type="number" id="inputParquimetro" value="60">
    </div>

    <div class="timer-box" id="displayTiempo">Reloj listo</div>
    <div id="displayAlarma" style="color: #ffab40; font-weight: bold; min-height: 24px;"></div>

    <button id="btnDetener" class="btn-stop" onclick="detenerAlarma()">🔕 DETENER ALARMA</button>

    <div id="map"></div>
    
    <button class="btn-nav" onclick="irAlAuto()">🧭 ¿Cómo llegar al auto?</button>
</div>

<audio id="audioAlarma" loop preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" type="audio/mpeg">
</audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker, interval;
    let alarmaYaSono = false;
    
    const audio = document.getElementById('audioAlarma');
    const btnDetener = document.getElementById('btnDetener');

    // REGISTRO DEL SERVICE WORKER (Para el Smartwatch y segundo plano)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log("Service Worker Activo");
        }).catch(err => console.log("Error SW:", err));
    }

    // Pedir permisos de notificación
    if ("Notification" in window) {
        Notification.requestPermission();
    }

    function iniciarEstacionamiento() {
        if (!navigator.geolocation) return alert("GPS no soportado");

        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            alarmaYaSono = false;
            
            const minutosTotales = parseInt(document.getElementById('inputParquimetro').value);
            const ahora = new Date().getTime();
            const horaFin = ahora + (minutosTotales * 60000);
            
            // Guardar datos en el almacenamiento persistente
            localStorage.setItem('parking_hora_fin', horaFin);
            localStorage.setItem('parking_lat', lat);
            localStorage.setItem('parking_lng', lng);
            localStorage.setItem('parking_activo', "true");

            // Dibujar Mapa
            if (!map) {
                map = L.map('map').setView([lat, lng], 17);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            }
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            map.panTo([lat, lng]);

            // Iniciar Wake Lock para que no se duerma la pantalla (si el navegador lo permite)
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => {});
            }

            if (interval) clearInterval(interval);
            interval = setInterval(actualizarEstado, 1000);
            
            // "Cargar" el audio con un toque del usuario
            audio.play().then(() => audio.pause());
            
            alert("¡Cronómetro iniciado! Puedes minimizar la app.");
        }, () => alert("Error de GPS"), { enableHighAccuracy: true });
    }

    function actualizarEstado() {
        if (localStorage.getItem('parking_activo') !== "true") return;

        const fin = parseInt(localStorage.getItem('parking_hora_fin'));
        const ahora = new Date().getTime();
        const faltanMs = fin - ahora;
        
        if (faltanMs <= 0) {
            document.getElementById('displayTiempo').innerText = "¡TIEMPO AGOTADO!";
            if (!alarmaYaSono) activarAlarma(0);
            return;
        }

        const min = Math.floor(faltanMs / 60000);
        const seg = Math.floor((faltanMs % 60000) / 1000);
        
        document.getElementById('displayTiempo').innerText = 
            `Faltan: ${min.toString().padStart(2,'0')}:${seg.toString().padStart(2,'0')}`;

        // DISPARAR ALARMA A LOS 5 MINUTOS (300,000 milisegundos)
        if (faltanMs <= 300000 && !alarmaYaSono) {
            activarAlarma(min);
        }
    }

    function activarAlarma(minutos) {
        alarmaYaSono = true;
        document.getElementById('displayAlarma').innerText = `⚠️ ¡QUEDAN ${minutos} MINUTOS!`;
        btnDetener.style.display = 'block';
        audio.play().catch(() => console.log("Esperando interacción para audio"));

        // ENVIAR AL SMARTWATCH vía Service Worker
        if (Notification.permission === "granted" && 'serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(registration => {
                registration.showNotification("🅿️ Alerta Parking Julius", {
                    body: `¡Atención! Te quedan ${minutos} minutos.`,
                    icon: "icon-parking.png",
                    vibrate: [500, 200, 500],
                    requireInteraction: true,
                    tag: 'alarma-parking'
                });
            });
        }
    }

    function detenerAlarma() {
        audio.pause();
        audio.currentTime = 0;
        btnDetener.style.display = 'none';
        document.getElementById('displayAlarma').innerText = "";
        localStorage.setItem('parking_activo', "false");
        if (interval) clearInterval(interval);
    }

    function irAlAuto() {
        const lat = localStorage.getItem('parking_lat');
        const lng = localStorage.getItem('parking_lng');
        if (!lat) return alert("No hay ubicación");
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`, '_blank');
    }

    window.onload = () => {
        if (localStorage.getItem('parking_activo') === "true") {
            interval = setInterval(actualizarEstado, 1000);
        }
    };
</script>
</body>
</html>
