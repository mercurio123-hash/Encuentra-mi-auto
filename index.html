<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <title>Parquímetro App</title>
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --alarm-bg: #ff0000; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overscroll-behavior-y: none; 
            user-select: none;
            transition: background-color 0.3s;
        }

        /* Clase para alarma visual */
        body.alarm-active {
            background-color: var(--alarm-bg) !important;
            animation: flashBg 0.5s infinite alternate;
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: opacity 0.3s;
        }

        body.alarm-active .container {
            background-color: #fff;
            border: 2px solid #fff;
        }

        h2 { margin: 0 0 25px 0; font-size: 24px; color: #333; }

        .input-group { margin-bottom: 25px; text-align: left; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"]:focus { border-color: var(--primary-color); }

        .btn {
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.98); box-shadow: none; }
        
        .btn-green { background-color: var(--success-color); }
        .btn-red { background-color: var(--danger-color); display: none; }
        .btn-blue { background-color: var(--primary-color); display: none; }

        .status-msg {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            min-height: 20px;
        }
        
        .timer-display {
            font-size: 48px;
            font-weight: 700;
            margin: 25px 0;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
        }
        
        body.alarm-active .timer-display {
            color: #000;
        }

        .alert-box {
            display: none;
            background-color: #ffebee;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            border-left: 5px solid #d32f2f;
        }

        @keyframes flashBg {
            from { background-color: #ff0000; }
            to { background-color: #a30000; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Parquímetro</h2>
    
    <div class="input-group">
        <label for="parkingTime">Tiempo (minutos):</label>
        <input type="number" id="parkingTime" inputmode="numeric" placeholder="Ej: 60" pattern="\d*">
    </div>

    <div id="alertBox" class="alert-box">
        ⚠️ ¡QUEDAN 5 MINUTOS!
    </div>

    <button id="btnStopAlarm" class="btn btn-red">DETENER ALARMA</button>
    <button id="btnSave" class="btn btn-green">INICIAR</button>
    <button id="btnMaps" class="btn btn-blue">📍 VER RUTA / MAPA</button>

    <div id="statusMsg" class="status-msg"></div>
    <div id="timerDisplay" class="timer-display">00:00</div>
</div>

<script>
    // --- MOTOR DE AUDIO MEJORADO PARA XIAOMI ---
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isAlarmPlaying = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        // Intento agresivo de despertar el audio en Xiaomi
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(e => console.log("Audio resume fail", e));
        }
    }

    function playAlarmSound() {
        initAudio(); // Asegurarnos que existe y está despierto
        
        // Detener anterior si existe
        stopAlarmSound();

        try {
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'square'; // 'Square' es más penetrante que 'sawtooth' para ruidos callejeros
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            
            // Modulación de frecuencia (Sirena)
            oscillator.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 0.4);
            oscillator.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.8);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); // Volumen fuerte

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.loop = true;
            isAlarmPlaying = true;
        } catch (e) {
            console.error("Error reproduciendo sonido", e);
        }
    }

    function stopAlarmSound() {
        if (oscillator) {
            try {
                oscillator.stop();
                oscillator.disconnect();
            } catch(e) {}
            oscillator = null;
            isAlarmPlaying = false;
        }
    }

    // --- LÓGICA WAKE LOCK ---
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.error('Wake Lock error:', err);
        }
    }

    // --- LÓGICA APP ---
    let parkingInterval;
    let endTime = null;
    let carLat = null;
    let carLng = null;
    let alarmTriggered = false;
    
    const timeInput = document.getElementById('parkingTime');
    const btnSave = document.getElementById('btnSave');
    const btnStopAlarm = document.getElementById('btnStopAlarm');
    const btnMaps = document.getElementById('btnMaps');
    const statusMsg = document.getElementById('statusMsg');
    const timerDisplay = document.getElementById('timerDisplay');
    const alertBox = document.getElementById('alertBox');
    const body = document.body;

    function resetUI() {
        clearInterval(parkingInterval);
        stopAlarmSound();
        alarmTriggered = false;
        endTime = null;
        
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }

        statusMsg.textContent = "";
        timerDisplay.textContent = "00:00";
        alertBox.style.display = 'none';
        btnStopAlarm.style.display = 'none';
        btnMaps.style.display = 'none';
        
        body.classList.remove('alarm-active');
        
        btnSave.textContent = "INICIAR";
        btnSave.disabled = false;
        btnSave.style.opacity = "1";
    }

    timeInput.addEventListener('input', () => {
        if(timeInput.value > 0) resetUI();
    });

    btnSave.addEventListener('click', async () => {
        // 1. Inicializar Audio con la interacción (Obligatorio en móviles)
        initAudio();
        
        // 2. En Xiaomi, forzamos un resume() extra aquí por si acaso
        if(audioCtx.state === 'suspended') await audioCtx.resume();

        const minutes = parseInt(timeInput.value);
        if (!minutes || minutes <= 0) {
            statusMsg.textContent = "Ingresa minutos válidos.";
            statusMsg.style.color = "red";
            return;
        }

        statusMsg.textContent = "Obteniendo GPS...";
        statusMsg.style.color = "#555";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    carLat = position.coords.latitude;
                    carLng = position.coords.longitude;
                    
                    startTimer(minutes);
                    requestWakeLock();

                    statusMsg.textContent = "¡Configurado! No cierres la pantalla.";
                    statusMsg.style.color = "green";
                    btnMaps.style.display = 'block';
                    btnSave.textContent = "ACTIVO";
                    btnSave.disabled = true;
                    btnSave.style.opacity = "0.5";
                },
                (error) => {
                    let msg = "Error GPS";
                    if(error.code == 1) msg = "Permiso de ubicación denegado";
                    statusMsg.textContent = msg;
                    statusMsg.style.color = "red";
                }
            );
        }
    });

    function startTimer(minutes) {
        const now = new Date().getTime();
        endTime = now + (minutes * 60 * 1000);
        if (parkingInterval) clearInterval(parkingInterval);
        updateTimerDisplay(endTime);
        // Chequeo cada 500ms para ser más preciso
        parkingInterval = setInterval(() => updateTimerDisplay(endTime), 500);
    }

    function updateTimerDisplay(targetEndTime) {
        const currentTime = new Date().getTime();
        let distance = targetEndTime - currentTime;

        if (distance < 0) {
            clearInterval(parkingInterval);
            timerDisplay.textContent = "00:00";
            statusMsg.textContent = "TIEMPO FINALIZADO";
            statusMsg.style.color = "red";
            stopAlarmSound();
            body.classList.remove('alarm-active');
            return;
        }

        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((distance % (1000 * 60)) / 1000);
        timerDisplay.textContent = 
            (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);

        if (distance <= 300000 && distance > 0 && !alarmTriggered) {
            triggerAlarm();
        }
    }

    function triggerAlarm() {
        alarmTriggered = true;
        
        // Intento final de asegurar que el audio esté despierto en Xiaomi
        if(audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().then(() => playAlarmSound());
        } else {
            playAlarmSound();
        }

        body.classList.add('alarm-active');
        statusMsg.textContent = "¡¡ALERTA!! Quedan < 5 min.";
        statusMsg.style.color = "#d32f2f";
        alertBox.style.display = 'block';
        btnStopAlarm.style.display = 'block';
        
        if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500]);
        }
    }

    btnStopAlarm.addEventListener('click', () => {
        stopAlarmSound();
        body.classList.remove('alarm-active');
        btnStopAlarm.style.display = 'none';
        alertBox.style.display = 'none';
        statusMsg.textContent = "Alarma apagada.";
        statusMsg.style.color = "#333";
    });

    btnMaps.addEventListener('click', () => {
        if (carLat && carLng) {
            const url = `https://www.google.com/maps/dir/?api=1&destination=${carLat},${carLng}`;
            window.open(url, '_blank');
        }
    });

    document.addEventListener('visibilitychange', async () => {
        // Al volver a la app, forzar audio y wakelock
        if (document.visibilityState === 'visible') {
            initAudio();
            if(audioCtx.state === 'suspended') await audioCtx.resume();
            
            if (wakeLock !== null) requestWakeLock();
            if (endTime) updateTimerDisplay(endTime);
        }
    });
</script>

</body>
</html>
