<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parking Julius Pro</title>
    <link rel="icon" type="image/png" href="icon-parking.png">
    <link rel="apple-touch-icon" href="icon-parking.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --danger: #f43f5e; --success: #22c55e; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 400px; margin: auto; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        #map { height: 200px; border-radius: 15px; margin: 15px 0; border: 1px solid #334155; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; width: 80px; font-size: 1.2rem; text-align: center; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-go { background: var(--success); color: white; }
        .btn-stop { background: var(--danger); color: white; display: none; animation: pulse 1s infinite; }
        #timer { font-size: 3rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 Parking Julius</h2>
    <div id="setup">
        <label>Minutos:</label><br>
        <input type="number" id="mins" value="6">
        <button class="btn-go" onclick="iniciar()">📍 GUARDAR UBICACIÓN</button>
    </div>
    
    <div id="active-ui" style="display:none">
        <div id="timer">00:00</div>
        <button id="btnDetener" class="btn-stop" onclick="detenerAlarma()">🔕 DETENER ALARMA</button>
    </div>

    <div id="map"></div>
    <button style="background:var(--accent);color:white" onclick="navegar()">🧭 REGRESAR AL AUTO</button>
</div>

<audio id="audioAlarma" loop><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker, countdown;
    const audio = document.getElementById('audioAlarma');

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    async function iniciar() {
        await Notification.requestPermission();
        navigator.geolocation.getCurrentPosition(pos => {
            const mins = parseInt(document.getElementById('mins').value);
            const ms = mins * 60000;
            localStorage.setItem('p_fin', Date.now() + ms);
            localStorage.setItem('p_lat', pos.coords.latitude);
            localStorage.setItem('p_lng', pos.coords.longitude);

            // Avisar al Service Worker
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'PROGRAMAR_ALERTAS', msTotales: ms });
            }

            // Desbloqueo silencioso de audio
            audio.play().then(() => { audio.pause(); audio.currentTime = 0; });

            document.getElementById('setup').style.display = 'none';
            document.getElementById('active-ui').style.display = 'block';
            document.getElementById('btnDetener').style.display = 'none'; // Asegurar que esté oculto al inicio

            reproducirContador();
            mostrarMapa(pos.coords.latitude, pos.coords.longitude);
        });
    }

    function reproducirContador() {
        if (countdown) clearInterval(countdown);
        countdown = setInterval(() => {
            const resto = localStorage.getItem('p_fin') - Date.now();
            const m = Math.floor(resto / 60000);
            const s = Math.floor((resto % 60000) / 1000);

            if (resto <= 0) {
                document.getElementById('timer').innerText = "¡TIEMPO!";
                document.getElementById('timer').style.color = "#f43f5e";
                document.getElementById('btnDetener').style.display = 'block'; // APARECE BOTÓN ROJO
                audio.play();
                clearInterval(countdown);
                return;
            }

            // Si faltan exactamente 5 minutos, mostramos el botón y sonamos una vez
            if (m === 5 && s === 0) {
                document.getElementById('btnDetener').style.display = 'block';
                audio.play(); // Suena para avisar los 5 min
                setTimeout(() => { if(localStorage.getItem('p_fin')) audio.pause(); }, 5000); // Suena solo 5 seg
            }

            document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function detenerAlarma() {
        audio.pause();
        audio.currentTime = 0;
        clearInterval(countdown);
        localStorage.removeItem('p_fin');
        document.getElementById('setup').style.display = 'block';
        document.getElementById('active-ui').style.display = 'none';
        document.getElementById('timer').style.color = "var(--accent)";
    }

    function mostrarMapa(lat, lng) {
        if (!map) {
            map = L.map('map').setView([lat, lng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        map.panTo([lat, lng]);
    }

    function navegar() {
        const lat = localStorage.getItem('p_lat');
        const lng = localStorage.getItem('p_lng');
        if (lat) window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`);
    }

    window.onload = () => {
        const fin = localStorage.getItem('p_fin');
        if (fin && fin > Date.now()) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('active-ui').style.display = 'block';
            reproducirContador();
            mostrarMapa(localStorage.getItem('p_lat'), localStorage.getItem('p_lng'));
        }
    };
</script>
</body>
</html>
